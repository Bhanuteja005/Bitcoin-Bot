[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket BTC 5-minute Up/Down trading desk, driven from Claude Code"
readme = "README.md"
authors = [
    { name = "Bhanuteja005" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polymarket-client>=0.11.0",
    "tzdata>=2026.4",
]

[project.scripts]
pm = "polybot.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
